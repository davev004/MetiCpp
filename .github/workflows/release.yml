
name: Release MetiC++

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    name: Verify CMake tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=

      - name: Build
        run: cmake --build build-release --parallel 2

      - name: Test
        run: ctest --test-dir build-release --output-on-failure

  build:
    name: Build ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        arch: [popcnt, avx2, avx512]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile Engine
        shell: bash
        run: |
          set -e

          # Select the target CPU instruction set.
          if [ "${{ matrix.arch }}" = "popcnt" ]; then
            FLAGS="-O3 -march=x86-64 -mpopcnt"
          elif [ "${{ matrix.arch }}" = "avx2" ]; then
            FLAGS="-O3 -march=x86-64-v3"
          elif [ "${{ matrix.arch }}" = "avx512" ]; then
            FLAGS="-O3 -march=x86-64-v4"
          fi

          # Set the output filename.
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BIN_NAME="MetiC++-windows-${{ github.ref_name }}-${{ matrix.arch }}.exe"
          else
            BIN_NAME="MetiC++-linux-${{ github.ref_name }}-${{ matrix.arch }}"
          fi

          echo "Building ${BIN_NAME}"
          echo "Compiler:"
          g++ --version

          # Compile the engine.
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            g++ -std=c++20 -flto -static -static-libgcc \
                -static-libstdc++ $FLAGS src/*.cpp -o "$BIN_NAME"
          else
            g++ -pthread -std=c++20 $FLAGS src/*.cpp -o "$BIN_NAME"

            # Inspect the POPCNT binary before validating its ISA.
            if [ "${{ matrix.arch }}" = "popcnt" ]; then
              echo "=== ELF ISA notes ==="
              readelf -n "$BIN_NAME" || true

              echo "=== ELF program headers ==="
              readelf -W -l "$BIN_NAME" || true

              echo "=== Matching ISA strings ==="
              readelf -n "$BIN_NAME" |
                grep -Ei 'ISA needed|x86-64-v[234]|GNU_PROPERTY_X86' || true

              # Reject an explicit x86-64-v3/v4 ISA requirement.
              if readelf -n "$BIN_NAME" | grep -Eq 'x86-64-v[34]'; then
                echo "::error::POPCNT binary advertises an x86-64-v3/v4 requirement"
                exit 1
              fi
            fi
          fi

          echo "Build completed: ${BIN_NAME}"

      - name: Upload Binary to Job Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: MetiC++-*

  release:
    name: Create GitHub Release
    needs: [build, verify]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all Compiled Binaries
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
